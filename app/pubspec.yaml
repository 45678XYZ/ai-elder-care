name: e_hakka_care
description: 客照e點通 App——長者模式（語音互動陪伴）＋照護者模式（資訊介面）。
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 裝置端 ASR（zh-TW，含靜音偵測）
  speech_to_text: ^7.0.0
  # 裝置端 TTS（第一版華語迴圈唸出回覆；zh-TW）
  flutter_tts: ^4.2.0
  # 播放正式 /chat 回傳的 reply_audio_url（Polly 合成、S3 presigned，串流）
  just_audio: ^0.9.40
  # 錄音：客語／音檔路線，錄成 m4a 送 /chat 由後端辨識（STT）
  # 用 7.x：5.x 家族的 record_linux 0.7.2 未實作 startStream，會讓 Android build 也編不過
  record: ^7.0.0
  # 錄音暫存路徑（getTemporaryDirectory）
  path_provider: ^2.1.0
  # 後端 API 呼叫
  http: ^1.2.0
  # 產生 client_request_id（/chat 與 routine 寫入端點的冪等鍵，見 docs/api.md）
  uuid: ^4.5.0
  # 記住「首次設定已完成」與長者基本資料，之後啟動直接進角色選擇
  shared_preferences: ^2.2.0
  # 導覽：照護者多畫面 + 具名路由（見 HANDOFF 畫面清單）
  go_router: ^14.2.0
  # 照護者統計圖表（折線／長條／Waffle）
  fl_chart: ^0.68.0
  # 農曆換算（今日畫面的農民曆牌面）。輸出為簡體，一律經 lunar_date.dart 轉繁再顯示
  lunar: ^1.7.8
  # 例行公事提醒：依 GET /routines 的定義排本地通知
  flutter_local_notifications: ^22.2.0
  # 排程通知要指定時區（台灣 +08:00），否則跨時區或日光節約會排錯時間
  timezone: ^0.11.1
  # 取得裝置目前時區名稱，餵給 timezone 初始化
  flutter_timezone: ^5.1.0
  # TODO: Cognito 登入 SDK（amplify_flutter + amplify_auth_cognito）

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # 早安／午安／晚安圖（長者今日頁的撕曆右半）。檔案缺席時畫面會退回色塊，
    # 不會壞，所以這個目錄可以先是空的。
    - assets/images/

  # 設計系統字體：Noto Serif TC（≥32sp 標題與農民曆）／Noto Sans TC（其餘）。
  #
  # **打包進 App，不走 google_fonts 執行期下載**：下載版在第一次啟動與離線時會先
  # 用系統字頂著、載完才跳成襯線，長輩會看到字「換了一次」；而且不同 Android 廠商
  # 的預設中文字不一樣（例如三星有自己的字），畫面會因機而異。
  #
  # 只收實際用到的字重（見 lib/theme/app_theme.dart）：襯線只有 900，
  # 黑體 500／700／900。字檔是 Noto CJK 的**繁體子集**，授權 SIL OFL 1.1（OFL.txt）。
  fonts:
    - family: NotoSerifTC
      fonts:
        - asset: assets/fonts/NotoSerifTC-Black.otf
          weight: 900
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC-Medium.otf
          weight: 500
        - asset: assets/fonts/NotoSansTC-Bold.otf
          weight: 700
        - asset: assets/fonts/NotoSansTC-Black.otf
          weight: 900
    # 客語缺字遞補（𠊎 U+2028E、吂 U+5402），只有這兩個字，2.4 KB。
    # 來源與重建指令見 AppTypography.hakkaFallback。
    - family: TWSungHakka
      fonts:
        - asset: assets/fonts/TWSungHakka.ttf
