<!DOCTYPE html>
<!--
  開發用的預覽外框：把 App 裝進手機尺寸的 iframe，方便在桌機瀏覽器上看實際比例。

  目標裝置是 Android 手機，桌機瀏覽器整頁開會被拉成寬版面，看起來跟實機差很多。
  這一頁只服務預覽，不是出貨內容——正式入口仍是 index.html。
-->
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>預覽 · 智慧長照陪伴</title>
  <style>
    :root {
      --frame: #2b2b2f;
      --page: #14141a;
      --text: #e9e4da;
      --muted: #9a948a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, "Noto Sans TC", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 24px 16px 40px;
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }
    label { font-size: 13px; color: var(--muted); }
    select {
      background: #23232a;
      color: var(--text);
      border: 1px solid #3a3a42;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 14px;
      font-family: inherit;
    }
    /* 手機外框：黑邊 + 圓角，讓比例一眼看得出來是手機 */
    .phone {
      background: var(--frame);
      border-radius: 34px;
      padding: 12px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
      transition: width .15s ease, height .15s ease;
    }
    iframe {
      display: block;
      border: 0;
      border-radius: 24px;
      background: #f3ecdd;
      width: 100%;
      height: 100%;
    }
    .hint { font-size: 12px; color: var(--muted); text-align: center; max-width: 460px; line-height: 1.7; }
    code { background: #23232a; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="bar">
    <label for="screen">畫面</label>
    <select id="screen">
      <option value="#/auth/sign-in">登入</option>
      <option value="#/auth/sign-up">註冊</option>
      <option value="#/elder/link">連結家人</option>
      <option value="#/elder/today">長者 · 今日</option>
      <option value="#/elder/chat">長者 · 聊天</option>
      <option value="#/">角色選擇</option>
      <option value="#/setup">初次設定</option>
      <option value="#/care/summary">照護者 · 摘要</option>
      <option value="#/care/timeline">照護者 · 時間軸</option>
      <option value="#/care/stats">照護者 · 統計</option>
      <option value="#/care/manage">照護者 · 管理</option>
    </select>

    <label for="size">尺寸</label>
    <select id="size">
      <option value="360x800">360 × 800（常見 Android）</option>
      <option value="412x915">412 × 915（Pixel）</option>
      <option value="390x844" selected>390 × 844（測試基準）</option>
      <option value="320x700">320 × 700（小螢幕）</option>
    </select>

  </div>

  <div class="phone" id="phone">
    <iframe id="app" title="App 預覽"></iframe>
  </div>

  <p class="hint">
    重新載入畫面請用上面的下拉選單。連結狀態與初次設定存在瀏覽器，
    要從頭走一次流程請開無痕視窗，或在 DevTools 清掉 Local Storage。
    <br>demo 驗證碼固定 <code>123456</code>。
  </p>

  <script>
    const phone = document.getElementById('phone');
    const app = document.getElementById('app');
    const screenSel = document.getElementById('screen');
    const sizeSel = document.getElementById('size');

    function applySize() {
      const [w, h] = sizeSel.value.split('x').map(Number);
      phone.style.width = (w + 24) + 'px';   // 24 = 左右內距
      phone.style.height = (h + 24) + 'px';
    }

    function load() {
      app.src = 'index.html' + screenSel.value;
    }

    sizeSel.addEventListener('change', applySize);
    screenSel.addEventListener('change', load);

    applySize();
    load();
  </script>
</body>
</html>
