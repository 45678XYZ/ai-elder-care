# ASR 模型整合 — conda 環境設定
# 用途：本機 container 開發與相容性預檢（production gate 以 SageMaker staging/runtime 為準）
# 建立：conda env create -f environment.yml
# 啟用：conda activate asr-model
# 更新：conda env update -f environment.yml --prune

name: asr-model
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # ---------- 基礎 ----------
  - python=3.11
  - pip

  # ---------- CUDA / GPU ----------
  - pytorch::pytorch=2.4.1
  - pytorch::torchaudio=2.4.1
  - nvidia::cuda-toolkit=12.4

  # ---------- 音訊處理 ----------
  - conda-forge::ffmpeg=7.1
  - conda-forge::libsndfile
  - conda-forge::soundfile=0.12.1

  # ---------- pip 套件 ----------
  - pip:
      # --- ASR 推論 (Taiwan-Tongues-ASR-CE) ---
      - faster-whisper==1.1.0
      - ctranslate2==4.5.0

      # --- ASR 推論 (FormoSpeech Whisper-v3) ---
      - transformers==4.47.1
      - accelerate==1.2.1

      # --- 模型下載與存取 ---
      - huggingface_hub==0.27.1

      # --- 音訊前處理 (Canonical Audio: mono/16kHz/16-bit PCM) ---
      - librosa==0.10.2
      - soundfile==0.12.1
      - pydub==0.25.1
      - av==13.1.0

      # --- 測試工具 (與 backend spec 一致) ---
      - pytest==8.3.5
      - hypothesis==6.122.3

      # --- 輔助 ---
      - numpy<2.0
      - pydantic>=2.0,<3.0
